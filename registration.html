<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Create Account</h1>
        <p>Fill in the form to register</p>

        <form action="#" method="post">

            <h3>Personal Information</h3>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
            placeholder="Enter your full name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
            placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
            placeholder="Create a password" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
            placeholder="Enter your phone number" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>


            <h3>Other Information</h3>

            <label>Gender:</label>

            <input type="radio" id="male" name="gender"
            value="Male" required>
            <label for="male" class="option">Male</label>

            <input type="radio" id="female" name="gender"
            value="Female">
            <label for="female" class="option">Female</label>

            <input type="radio" id="other" name="gender"
            value="Other">
            <label for="other" class="option">Other</label>


            <label>Hobbies:</label>

            <input type="checkbox" id="reading" name="hobbies[]"
            value="Reading">
            <label for="reading" class="option">Reading</label>

            <input type="checkbox" id="music" name="hobbies[]"
            value="Music">
            <label for="music" class="option">Music</label>

            <input type="checkbox" id="sports" name="hobbies[]"
            value="Sports">
            <label for="sports" class="option">Sports</label>


            <label for="country">Choose Country:</label>
<select id="country" name="country" required>
    <option value="">Select your country</option>
    <option value="Bangladesh">Bangladesh</option>
    <option value="India">India</option>
    <option value="Pakistan">Pakistan</option>
    <option value="Nepal">Nepal</option>
    <option value="Malaysia">Malaysia</option>
    <option value="United States">United States</option>
</select>
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4"
            placeholder="Enter your address" required></textarea>


            <input type="checkbox" id="terms" name="terms"
            value="Accepted" required>
            <label for="terms" class="option">
                I agree to the Terms and Conditions
            </label>


            <input type="submit" value="Register">
            <input type="reset" value="Reset" class="reset">

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

    </div>

</body>
</html>
